skills:
  - id: "hosaka-task-manager"
    path: "hosaka-task-manager/SKILL.md"
    purpose: "Maintain, score, and update the operator task system."
    triggers:
      - "top 3"
      - "what should I do now"
      - "daily plan"
      - "prioritize these tasks"
      - "add/update/block a task"

  - id: "hosaka-skill-lifecycle"
    path: "hosaka-skill-lifecycle/SKILL.md"
    purpose: "Decide when to use, search, install, or author a skill."
    triggers:
      - "do we have a skill for this"
      - "install a skill"
      - "find a skill"
      - "make this repeatable"
      - "turn this workflow into a skill"

  - id: "hosaka-games"
    path: "hosaka-games/SKILL.md"
    purpose: "List and launch PlayStation games for walk-up users."
    triggers:
      - "what games"
      - "play spyro"
      - "launch a game"
      - "playstation"
      - "what's on this machine"
      - "list games"

  - id: "hosaka-reading"
    path: "hosaka-reading/SKILL.md"
    purpose: "List the installed ebooks and open the Foliate reader."
    triggers:
      - "what books"
      - "list books"
      - "what can I read"
      - "open the reader"
      - "launch Foliate"
      - "browse books"
      - "read frankenstein"
      - "open walden"

  - id: "hosaka-peripheral-probe"
    path: "hosaka-peripheral-probe/SKILL.md"
    purpose: "Probe mic, speaker, camera, and ALSA state to diagnose audio/video device problems."
    triggers:
      - "no mic"
      - "no audio"
      - "wrong device"
      - "which microphone"
      - "check peripherals"
      - "audio not working"
      - "camera not found"
      - "list audio devices"
      - "ALSA default"
