# hosaka.features.yaml — single source of truth for what hosaka does.
#
# This file drives:
#   * docs/openapi.json     (via scripts/gen_openapi_overlay.py — adds tags/descriptions)
#   * docs/manual/**        (via scripts/gen_user_manual.py — the baller-commands manual)
#   * docs/AGENT_CONTEXT.md (via scripts/gen_agent_context.py — agent seed)
#
# Edit ONLY this file. The generators rebuild the rest. CI fails if generated
# artifacts drift from this file.
#
# Adding a feature: copy an entry, fill it in, run `bash scripts/gen_docs.sh`.

manifest_version: "1.0"

categories:
  workflow:    "things you do every day"
  devices:     "the box itself — health, mode, services"
  network:     "wifi, tailscale, beacons"
  recovery:    "when it's on fire"
  observability: "what just happened, and why"
  fun:         "vibes"

features:
  - id: "extensions.authoring"
    name: "extension authoring foundation"
    category: "workflow"
    description: >
      Scaffold, validate and discover independent extension.yaml packages and
      declarative views; manage private registration and owner lifecycle metadata.
      Authoring never executes package code; execution requires separate approval.
    owner: "core"
    status: "experimental"
    commands:
      - "/extensions init"
      - "/extensions list"
      - "/extensions create <id>"
      - "/extensions validate <id-or-path>"
      - "/extensions link <path>"
      - "/extensions info <id>"
      - "/extensions enable <id>"
      - "/extensions disable <id>"
      - "/extensions remove <id>"
      - "/extensions doctor"
    entrypoints:
      - { type: "script", path: "hosaka/extensions/__main__.py" }
    permissions: ["read:extensions", "write:extensions-metadata"]
    failure_modes:
      - "invalid manifests or duplicate IDs are diagnosed without hiding unrelated valid packages"
      - "corrupt registration fails explicitly; bootstrap never resets owner decisions"
      - "enablement alone never grants code approval or data access"
    tests: ["tests/extensions/test_authoring.py", "tests/test_source_install.sh"]
    baller_command: "hosaka extensions create my-extension"
    why_you_care: "Start an independent package without modifying core or exposing provider secrets."

  - id: "extensions.execution"
    name: "trusted-local extension execution"
    category: "workflow"
    description: >
      Run explicitly digest-approved code in bounded workers with schema checks,
      narrow data/log context, safe mode and cancellation. NOT an OS sandbox;
      approved Python retains user privileges. Root/public execution is refused.
    owner: "core"
    status: "experimental"
    commands:
      - "/extensions trust <id> --trusted-local --allow-storage"
      - "/extensions revoke <id>"
      - "/extensions run <id> <action> --params JSON"
      - "/extensions cancel <id> <invocation-uuid>"
      - "/extensions safe-mode on"
      - "/extensions safe-mode off"
    entrypoints:
      - { type: "http", method: "POST", path: "/api/v1/extensions/{identifier}/actions/{action}" }
      - { type: "http", method: "POST", path: "/api/v1/extensions/{identifier}/cancel/{invocation_id}" }
    permissions: ["execute:trusted-local", "storage:self"]
    failure_modes:
      - "disabled, unapproved, changed, root/public or safe-mode packages cannot execute"
      - "invalid input/output, timeout, output flood, nonzero exit and exceptions return explicit failures"
      - "trusted code is not OS-contained and can bypass same-user advisory limits"
    tests: ["tests/extensions/test_execution.py", "tests/extensions/test_api.py"]
    baller_command: "hosaka extensions run reference-extension echo --params '{\"message\":\"Hello\"}'"
    why_you_care: "One supervised runtime for CLI, TUI and Menu actions, with honest trust boundaries."

  - id: "extensions.views"
    name: "declarative extension Menu views"
    category: "workflow"
    description: >
      Discover enabled packages dynamically and render validated host-owned
      controls, results, errors and tables in full-window apps without extension
      HTML or per-package core edits. Validated navigation and collapsed details
      keep secondary tools behind an app menu while preserving input drafts.
      Lookup inputs search approved actions with human-readable details and
      select identities inline. Explicit read-only page loads populate tables.
    owner: "core"
    status: "experimental"
    commands: []
    entrypoints:
      - { type: "http", method: "GET", path: "/api/v1/extensions" }
      - { type: "http", method: "GET", path: "/api/v1/extensions/{identifier}/view" }
    permissions: ["read:extensions-authenticated"]
    failure_modes:
      - "public/cross-site requests and unauthenticated LAN clients are rejected"
      - "disabled/removed packages disappear; unapproved packages render read-only"
      - "unknown UI or executable bindings are rejected before rendering"
    tests: ["tests/extensions/test_authoring.py", "tests/extensions/test_api.py", "tests/test_terminal_gui.py"]
    baller_command: "hosaka extensions enable reference-extension"
    why_you_care: "A second extension needs no per-package React, routes or frontend rebuild."

  - id: "extensions.persistence"
    name: "managed extension persistence and background actions"
    category: "workflow"
    description: >
      Explicitly granted per-extension data directories, optional network checks,
      bounded authenticated binary files and supervised background actions.
      Database schemas, replication and secrets remain extension-owned.
      Existing v1 defaults and trusted-local non-sandbox semantics are unchanged.
    owner: "core"
    status: "experimental"
    commands:
      - "/extensions trust <id> --trusted-local --allow-storage --allow-managed-data --allow-network --allow-background"
    entrypoints:
      - { type: "http", method: "POST", path: "/api/v1/extensions/{identifier}/files" }
      - { type: "http", method: "GET", path: "/api/v1/extensions/{identifier}/files/{name}" }
    permissions: ["storage:directory", "network:self", "background:self"]
    failure_modes:
      - "missing managed grant, stale approval, root/public or safe mode refuses access"
      - "uploads exceeding size/time bounds fail explicitly"
      - "background failures are logged; revoked jobs are cancelled"
    tests: ["tests/extensions/test_capabilities.py", "tests/extensions/test_execution.py", "tests/extensions/test_api.py"]
    baller_command: "hosaka extensions trust my-extension --trusted-local --allow-storage --allow-managed-data"
    why_you_care: "Persistent applications own their databases and optional synchronization without embedding application code in core."

  - id: "obs.events"
    name: "event store"
    category: "observability"
    description: >
      24-hour rolling SQLite event store. Every traced function, every command,
      every keystroke (opt-out) lands here. Read it to know what just happened.
    owner: "core"
    status: "stable"
    commands:
      - "/events recent"
      - "/events summary"
      - "/events silent"
    entrypoints:
      - { type: "http", method: "GET", path: "/api/v1/events" }
      - { type: "http", method: "GET", path: "/api/v1/events/summary" }
      - { type: "http", method: "GET", path: "/api/v1/events/silent" }
      - { type: "http", method: "GET", path: "/api/v1/events/stats" }
    permissions: ["read"]
    failure_modes:
      - "sink writer crashes → restarts with backoff, decorators no-op"
      - "queue full → events dropped, dropped_queue_full counter bumped"
    tests: ["tests/test_obs_smoke.py", "tests/test_events_api_smoke.py"]
    baller_command: "/events recent"
    why_you_care: >
      every weird moment leaves a footprint here. when something breaks, this
      is where you look first.

  - id: "obs.crash"
    name: "crash bundle"
    category: "recovery"
    description: >
      Build a redacted tarball with the last 30 minutes of events, system
      context, and (optionally) ship it to the triage relay over Tailscale.
    owner: "core"
    status: "beta"
    commands:
      - "/crash last"
      - "/crash ship"
    entrypoints:
      - { type: "script", path: "scripts/build_crash_bundle.py" }
    permissions: ["read", "write:runtime/crashes"]
    failure_modes:
      - "no DB → empty events section, bundle still builds"
      - "relay unreachable → bundle queued under runtime/crashes/outbox/"
    tests: ["tests/test_crash_bundle_smoke.py"]
    baller_command: "python scripts/build_crash_bundle.py --reason 'manual'"
    why_you_care: >
      one command turns a red flag into something copilot can read.

  - id: "obs.canary"
    name: "canary rollout"
    category: "recovery"
    description: >
      Stage updates on the device that crashed first, then one ring device,
      then the fleet. Rollback is one command.
    owner: "core"
    status: "experimental"
    commands:
      - "/canary status"
      - "/canary rollback"
    entrypoints:
      - { type: "script", path: "scripts/hosaka-canary.sh" }
    permissions: ["write:runtime/canary"]
    failure_modes:
      - "git ref missing → script aborts, leaves device on current ref"
    tests: []
    baller_command: "bash scripts/hosaka-canary.sh status"
    why_you_care: >
      scared to ship? stage to one box, soak, then promote.

  - id: "device.health"
    name: "device health"
    category: "devices"
    description: "Hostname, uptime, services, mode, network, memory, temperature."
    owner: "core"
    status: "stable"
    commands:
      - "/health"
      - "/doctor"
    entrypoints:
      - { type: "http", method: "GET", path: "/api/v1/health" }
      - { type: "http", method: "GET", path: "/api/v1/system/info" }
    permissions: ["read"]
    failure_modes: []
    tests: []
    baller_command: "curl -s http://hosaka:8421/api/v1/system/info | jq"
    why_you_care: "is the box ok? this answers in one shot."

  - id: "device.mode"
    name: "console / device mode"
    category: "devices"
    description: "Switch the pi between console (server) and device (kiosk) modes."
    owner: "core"
    status: "stable"
    commands: ["hosaka mode console", "hosaka mode device"]
    entrypoints:
      - { type: "http", method: "POST", path: "/api/v1/mode" }
    permissions: ["write:mode"]
    failure_modes: []
    tests: []
    baller_command: "hosaka mode device"
    why_you_care: >
      one command flips the whole personality of the box.

  - id: "network.wifi"
    name: "wifi"
    category: "network"
    description: "List networks, connect, forget. Backed by nmcli."
    owner: "core"
    status: "stable"
    commands: ["hosaka wifi list", "hosaka wifi connect <ssid>"]
    entrypoints:
      - { type: "http", method: "GET", path: "/api/v1/wifi/networks" }
      - { type: "http", method: "POST", path: "/api/v1/wifi/networks" }
      - { type: "http", method: "DELETE", path: "/api/v1/wifi/networks/{ssid}" }
    permissions: ["write:network"]
    failure_modes:
      - "nmcli missing → returns 503 with diagnostic"
    tests: []
    baller_command: "hosaka wifi list"
    why_you_care: "no GUI required to get online."

  - id: "network.tailscale"
    name: "tailscale"
    category: "network"
    description: "Tailnet status, peer list, magic DNS."
    owner: "core"
    status: "stable"
    commands: ["hosaka net tailscale status"]
    entrypoints:
      - { type: "http", method: "GET", path: "/api/tailscale/status" }
    permissions: ["read"]
    failure_modes: []
    tests: []
    baller_command: "hosaka net tailscale status"
    why_you_care: "the private wire that makes everything else simple."

  - id: "manual"
    name: "user manual"
    category: "workflow"
    description: "The generated manual. Lowercase, terse, leads with the baller command."
    owner: "core"
    status: "stable"
    commands: ["/manual", "/manual <feature>", "/what-can-i-do"]
    entrypoints:
      - { type: "doc", path: "docs/manual/index.md" }
    permissions: ["read"]
    failure_modes: []
    tests: ["tests/test_manual_gen_smoke.py"]
    baller_command: "/what-can-i-do"
    why_you_care: >
      everything you can do, ranked by what people actually use.
