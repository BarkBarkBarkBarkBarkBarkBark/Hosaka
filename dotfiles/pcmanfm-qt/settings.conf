[Desktop]
# Hosaka desktop substrate. Right-click forwards to the window manager
# (Openbox) so the Hosaka root menu appears instead of pcmanfm-qt's generic
# "Create New / Paste" menu.
Wallpaper=/home/operator/.local/share/hosaka/desktop-background.png
WallpaperMode=crop
BgColor=#0b0d10
ShowWmMenu=true
DesktopIconSize=96
FgColor=#ffffff
ShadowColor=#000000

[Behavior]
SingleClick=true
