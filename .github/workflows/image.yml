name: image

# Publish multi-arch container images for the Hosaka client.
#
# Triggers:
#   - push to main              → :main + :edge + :latest
#   - push of a v* tag          → :vX.Y.Z
#   - manual run                → whatever SHA you kick it off against
#
# Default tags are promoted only after the published image passes smoke tests.

on:
  push:
    branches: [main]
    tags:     ["v*"]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installers:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: "3.12"
      - name: Test appliance runtime defaults
        if: runner.os == 'Linux'
        run: |
          python -m pip install -r requirements-hosaka.txt pytest
          bash scripts/install-picoclaw.sh --prefix "$RUNNER_TEMP/hosaka-test-tools" --no-runtime
          export PATH="$RUNNER_TEMP/hosaka-test-tools/bin:$PATH"
          python -m pytest -q \
            tests/test_appliance_install.py tests/test_picoclaw_runtime.py \
            tests/test_hosaka_chat.py tests/test_hosaka_main_console.py \
            tests/test_play.py tests/test_games.py tests/test_games_api.py \
            tests/test_games_menu.py tests/test_update_deployment.py tests/test_llm_setup.py
      - name: Test Unix installer
        if: runner.os == 'Linux'
        run: |
          bash tests/test_install.sh
          bash tests/test_source_install.sh
          bash tests/test_docker_client.sh
      - name: Test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tests/test_install.ps1
          ./tests/test_docker_client.ps1

  build:
    needs: installers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set lower-case owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/hosaka
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=edge,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
          labels: |
            org.opencontainers.image.title=Hosaka
            org.opencontainers.image.description=Hosaka Field Terminal — client container
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build + push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/hosaka:build-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            HOSAKA_COMMIT=${{ github.sha }}
          provenance: false
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Smoke test — ui_built
        env:
          IMAGE: ghcr.io/${{ steps.owner.outputs.name }}/hosaka@${{ steps.build.outputs.digest }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          trap 'docker rm -f hosaka-smoke' EXIT
          docker run -d --name hosaka-smoke -p 127.0.0.1:18421:8421 "$IMAGE"
          STATUS=""
          for i in $(seq 1 20); do
            sleep 3
            if STATUS=$(curl -fsS http://127.0.0.1:18421/api/health); then break; fi
          done
          echo "Health response: $STATUS"
          if [ -z "$STATUS" ]; then
            docker logs hosaka-smoke
            echo "::error::Container did not respond to /api/health" && exit 1
          fi
          echo "$STATUS" | jq -e --arg sha "$EXPECTED_COMMIT" \
            '.web == "ok" and .ui_built == true and .commit == $sha'
          curl -fsS http://127.0.0.1:18421/build-stamp.json \
            | jq -e --arg sha "$EXPECTED_COMMIT" '.sha == $sha'
          echo "Published image and frontend match this commit — smoke test passed"

      - name: Test container credentials and workspace permissions
        env:
          HOSAKA_IMAGE: ghcr.io/${{ steps.owner.outputs.name }}/hosaka@${{ steps.build.outputs.digest }}
        run: bash tests/test_container_runtime.sh

      - name: Promote verified image
        env:
          IMAGE: ghcr.io/${{ steps.owner.outputs.name }}/hosaka@${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create --tag "$tag" "$IMAGE"
          done <<< "$TAGS"

      - name: Summary
        run: |
          {
            echo "### hosaka image published"
            echo ""
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
