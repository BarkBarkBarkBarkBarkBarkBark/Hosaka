# 18. Agent integration

Social cognition must not itself implement game launching or shell operations.

Define:

```python
class AgentExecutor(Protocol):

    async def execute(
        self,
        request: AgentRequest,
    ) -> AgentResult:
        ...

    async def cancel(
        self,
        request_id: UUID,
    ) -> None:
        ...
```

Implement:

```text
PicoClawAgentExecutor
```

Hosaka's social layer decides:

```text
should the external agent be invoked?
```

PicoClaw decides:

```text
what tool should be called?
```

The social layer then separately decides:

```text
should the result be spoken?
```

Tool execution must never imply spoken narration.

---

# 19. Security boundary

Separate tools into:

```text
guest
trusted
```

Guest examples:

```text
launch_game
list_games
set_volume
show_status
play_music
open_safe_app
```

Trusted examples:

```text
shell
filesystem_write
install_package
network_configuration
systemctl
git mutation
shutdown
reboot
```

Speaker diarization is not authentication.

Voice identity must never automatically grant trusted access.

Use a physical/local owner authorization mechanism for privileged actions.

