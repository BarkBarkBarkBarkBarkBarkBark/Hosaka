# 13. Working memory

Working memory should contain interpreted facts rather than simply duplicating the transcript.

Examples:

```text
They only have one controller.

Speaker 2 likes puzzle games.

The current game does not seem popular.

Someone previously mentioned Sheep.

Hosaka last spoke three minutes ago.
```

Default maximum:

```text
20 items
```

Default TTL:

```text
30 minutes
```

Support compaction.

