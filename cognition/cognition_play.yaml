# 10. Social governor

Implement a deterministic scoring engine.

Initial scoring concept:

```text
positive influences

direct address             +1.00
explicit question          +0.65
unresolved question        +0.50
candidate relevance        +0.45
candidate importance       +0.35
urgency                    +0.60
confidence                 +0.25
long pause                 +0.20
turns since Hosaka spoke   +0.15
humor value                +0.10
```

Negative influences:

```text
human currently speaking   -1.00
multiple humans speaking   -1.00
recent Hosaka speech       -0.70
rapid exchange             -0.45
low ASR confidence         -0.50
topic drift                -0.60
social risk                -0.50
staleness                  -0.70
```

Normalize to:

```text
0.0 - 1.0
```

Suggested thresholds:

```text
< 0.30
discard

0.30 - 0.68
hold

>= 0.68
speak at next conversational gap

>= 0.94
interruption permitted
```

Human speech is normally a hard inhibitor.

The preferred normal outcome should often be:

```text
NO_ACTION
```

---

# 11. Conversational silence target

Track Hosaka's participation ratio.

Suggested social behavior target:

```text
minimum turn share         ~3%
preferred normal share     ~10%
soft maximum               ~20%
```

These are tuning values, not hard rules.

A room full of people talking rapidly should push Hosaka below 10%.

A one-on-one conversation where Hosaka is being directly addressed may naturally exceed 20%.

