# Hosaka Embodied Social Agent — Implementation Handoff

## Objective

Implement Hosaka as an always-available conversational cyberdeck agent with:

* continuous speech perception
* direct conversational responses
* a persistent but bounded internal cognitive state
* one chambered thought that can wait for a natural conversational opening
* strong conversational inhibition so Hosaka does not constantly talk
* interruption/barge-in support
* provider-agnostic LLM support
* online-primary / local-offline fallback
* Cavasik as Hosaka's visual face
* a single `yap` command that launches the embodied conversational mode
* clean separation between cognition, voice, face, agent/tool execution, and external model providers

The goal is not to make another voice assistant.

The desired behavior is closer to:

> Hosaka has been hanging out in the room, understands roughly what people are talking about, occasionally has something worth saying, waits its turn, can answer when addressed, can be talked over, and can operate the cyberdeck.

