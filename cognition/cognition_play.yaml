# 7. Internal cognition

Do not implement a perpetual stream of hidden prose.

Implement perpetual structured state.

Example:

```python
class InternalState(BaseModel):
    attention_target: str | None
    attention_strength: float

    curiosity: float
    social_energy: float

    urge_to_speak: float
    suppression: float

    confidence: float

    current_goal: str | None

    unresolved_items: list[str]

    chamber_candidate_id: UUID | None
```

Maintain this state through normal deterministic code wherever possible.

Use the LLM periodically or event-driven to perform reflection.

---

# 8. Cognitive levels

Implement four functional levels.

## Level 0 — reflex

No LLM.

Always active.

Responsibilities:

```text
VAD events
human speech state
speaker change state
barge-in
speech cancellation
cooldowns
timers
```

---

## Level 1 — attention

Prefer deterministic processing.

Triggered by:

```text
new finalized utterance
speaker change
topic change
silence transition
```

Tracks:

```text
who is talking
whether Hosaka was addressed
topic continuity
conversation speed
silence duration
turn count
whether multiple people are talking
```

---

## Level 2 — reflection

Uses an LLM.

Triggered primarily by meaningful events.

Do not constantly poll.

Suggested triggers:

```text
final utterance
unanswered question
interesting topic change
direct address
long silence
significant new information
```

Minimum reflection interval:

```text
1500 ms
```

Idle fallback reflection:

```text
approximately every 10 seconds
```

Reflection output must be structured.

Example schema:

```python
class ReflectionResult(BaseModel):
    interesting: bool
    observations: list[str]
    unresolved_items: list[str]

    candidate_worth_generating: bool
    candidate_kind: str | None

    relevance: float
```

"No thought" must be a valid successful output.

---

## Level 3 — chamber

Holds one candidate.

No speech occurs from this layer directly.

---

## Level 4 — expression

The deterministic social governor authorizes speech.

