# 31. State ownership

Use one authoritative owner for conversational state.

Suggested:

```text
SocialEngine
```

Workers should emit events.

Workers should not mutate shared state directly.

Use:

```text
event
→ SocialEngine
→ state mutation
→ derived events
```

This prevents concurrency bugs.

