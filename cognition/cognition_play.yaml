# 17. Provider failure behavior

Default timeouts:

```text
realtime      8 seconds
reflection    20 seconds
complex       30 seconds
```

Provider health:

```text
healthy
degraded
unavailable
```

After two failed requests:

```text
mark unhealthy for ~30 seconds
```

Retry through fallback.

If all providers fail:

```text
do not crash

keep:
VAD
speaker tracking
conversation state
chamber
face
barge-in
runtime controls
```

