# 16. Routing strategy

Support logical model roles.

```text
realtime
reflection
complex
```

Recommended default:

```yaml
realtime:
  primary: openai
  fallback: ollama

reflection:
  primary: ollama
  fallback: openai

complex:
  primary: openai
  fallback: ollama
```

This means cheap ongoing cognition can stay local while hard/direct requests can use the online provider.

If internet disappears:

```text
OpenAI unavailable
        |
        v
Ollama becomes provider
```

Conversation state must remain intact.

Provider-managed conversation IDs must never be canonical state.

Hosaka owns its context.

