# 23. Face states

Implement:

```python
class FaceState(str, Enum):
    IDLE = "idle"
    LISTENING = "listening"
    THINKING = "thinking"
    CHAMBERED = "chambered"
    SPEAKING = "speaking"
    INTERRUPTED = "interrupted"
    EXCITED = "excited"
    CONFUSED = "confused"
    SLEEPING = "sleeping"
```

Map cognitive state to visual state.

Example:

```text
