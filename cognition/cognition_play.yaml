# 2. Architecture

Use this conceptual architecture:

```text
                    HOSAKA
                       |
      +----------------+----------------+
      |                |                |
      v                v                v
  PERCEPTION       COGNITION          ACTION
      |                |                |
      |             attention         tools
      |             memory            games
      |             chamber           windows
      |                |
      +----------------+
                       |
                       v
                 SOCIAL GOVERNOR
                  /           \
              silence         speak
                                |
                                v
                               TTS
                                |
                   +------------+------------+
                   |                         |
                   v                         v
                SPEAKER                  CAVASIK
                                           |
                                           v
                                      HOSAKA FACE
```

Cavasik is not an agent tool.

It is part of Hosaka's embodied runtime.

---

# 3. Core rule

The core behavioral principle is:

```text
continuous awareness
does not imply
continuous speech
```

Hosaka should maintain internal state continuously while strongly preferring silence.

The LLM may propose things to say.

The LLM must not directly authorize speech.

A deterministic social governor decides whether Hosaka speaks.

---

# 4. Conversational categories

Implement two primary speech categories.

## Direct response

A response caused by the current conversation turn.

Examples:

```text
"Hosaka, launch Crash Bandicoot."

"Hosaka, what game has multiplayer?"

"What do you think?"

"No, I meant the other one."
```

Direct responses receive high priority.

They should still respect obvious conversational floor conditions unless the command is urgent.

---

## Chambered thought

A thought generated earlier that remains worth saying but should wait for an appropriate opening.

Example:

```text
Speaker A:
"I thought the PlayStation came out in 1992."

Conversation continues.

Hosaka internally generates:

"PlayStation launched in Japan in 1994."

Hosaka does not interrupt.

Several seconds later there is a natural gap.

Hosaka:
"One thing from earlier — the Japanese launch was actually 1994."
```

This behavior is central.

---

# 5. Single-slot chamber

Implement exactly one chamber slot in v1.

Do not create a FIFO thought queue.

```python
class Chamber:
    current: ThoughtCandidate | None
```

A new candidate may replace the chambered candidate only if:

```text
new_utility > existing_utility + replacement_margin
```

or the existing candidate is stale.

Default:

```text
replacement_margin = 0.15
```

Candidates must decay with time.

Suggested defaults:

```text
default thought TTL          45 seconds
direct response TTL          12 seconds
joke TTL                     20 seconds
factual callback TTL         60 seconds
urgent correction TTL        15 seconds
```

Candidate relevance should decay approximately every 5 seconds.

Example:

```text
relevance *= 0.94
importance *= 0.98
```

If the conversation clearly changes topic, stale candidates should usually be discarded.

---

# 6. Interrupted thought

If Hosaka begins speaking and a human talks over it:

1. immediately duck audio
2. cancel TTS if the person continues speaking
3. mark the candidate interrupted
4. decide whether it deserves to return to the chamber

Do not automatically retry.

Defaults:

```text
interrupted_candidate_priority *= 0.75
max_retry_count = 1
```

Discard it if the topic has moved on.

This enables behavior like:

```text
"Anyway, what I was going to say..."
```

without making Hosaka stubborn.

