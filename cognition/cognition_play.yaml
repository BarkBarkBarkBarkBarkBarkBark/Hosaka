# 21. Barge-in

This is mandatory.

Behavior:

```text
Hosaka speaking
      |
human speech begins
      |
after ~120 ms
      |
duck Hosaka volume
      |
speech continues
      |
after ~250 ms
      |
cancel TTS
      |
human gets floor
```

Cancellation must be idempotent.

There may never be more than one active speech instance.

