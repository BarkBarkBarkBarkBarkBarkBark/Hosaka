# 29. `yap` command

Create a top-level CLI command:

```text
yap
```

Meaning:

```text
start Hosaka embodied conversational mode
```

Not merely:

```text
launch Cavasik
```

Default behavior:

```text
1. validate audio devices
2. validate configured providers
3. start local Ollama if configured and not running
4. start social cognition engine
5. start ASR/VAD integration
6. start TTS
7. start PicoClaw integration
8. launch Cavasik
9. configure Cavasik audio source
10. fullscreen/raise face
11. set state IDLE
12. begin always-listening mode
```

Support:

```text
yap
yap stop
yap status
yap --offline
yap --mute
yap --no-face
yap --debug
```

Possible semantics:

```text
--offline
force local provider routing

--mute
listen but never authorize TTS

--no-face
run cognition without Cavasik

--debug
show event/state traces
```

