→ IDLE

human speaks
→ LISTENING

reflection/agent reasoning running
→ THINKING

candidate exists in chamber
→ CHAMBERED

Hosaka TTS active
→ SPEAKING

human interrupts Hosaka
→ INTERRUPTED
then immediately
→ LISTENING
```

