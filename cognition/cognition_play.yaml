# 40. Definition of done

The subsystem is implementation-ready when a real Jetson deployment can perform this sequence:

```text
$ yap

Cavasik launches fullscreen.

Hosaka enters IDLE.

A person speaks.

Hosaka enters LISTENING.

Hosaka transcribes the speaker.

The conversation continues.

Hosaka internally generates a useful candidate.

Hosaka enters CHAMBERED but does not speak.

Conversation continues.

A natural opening occurs.

Social governor authorizes the candidate.

Hosaka enters SPEAKING.

Cavasik reacts specifically to Hosaka's TTS audio.

A human talks over Hosaka.

Hosaka immediately stops speaking.

Cavasik returns to LISTENING.

The conversation continues.

Internet disappears.

Hosaka transparently falls back to Ollama.

Conversation state remains intact.
```

Do not optimize model quality until this entire lifecycle works.

Prioritize, in order:

```text
1. correct state ownership
2. cancellation
3. conversational inhibition
4. provider independence
5. chamber behavior
6. observability
7. Cavasik embodiment
8. model quality
```

The system should first become socially well-behaved.

Only then make it smarter.
