# 33. Critical architecture foot guns

## Foot gun: OpenAI wire format becomes internal model

Do not pass OpenAI response objects into core code.

Convert all provider results into project-owned domain types.

---

## Foot gun: LLM decides whether it gets to speak

Do not implement:

```text
LLM:
"Should I speak?"

LLM:
"Yes"

TTS:
starts
```

The LLM proposes.

The governor authorizes.

---

## Foot gun: perpetual prose internal monologue

Do not constantly generate prose.

This wastes:

```text
GPU
power
context
latency
API money
thermal headroom
```

Maintain structured internal state continuously.

Use event-driven reflection.

---

## Foot gun: thought queue

Do not create:

```python
deque[ThoughtCandidate]
```

Use one chamber.

Thoughts should die frequently.

---

## Foot gun: stale generations

If a response was generated for a conversation state that no longer exists, discard it.

Every generation should be associated with:

```text
source utterance IDs
conversation generation/version
```

Cancel obsolete local inference when possible.

---

## Foot gun: Cavasik hears itself incorrectly

If Cavasik visualizes the entire system mix:

```text
games
music
system notifications
Hosaka
```

all become Hosaka's "face."

Use dedicated audio routing.

---

## Foot gun: Hosaka hears its own TTS

This can create:

```text
self-transcription
self-response loops
constant interruption
```

Implement:

```text
AEC
or
playback-reference suppression
or
known TTS transcript suppression
```

before enabling unrestricted always-listening deployment.

---

## Foot gun: partial transcripts enter memory

Partial ASR is unstable.

Use partials for:

```text
turn-taking hints
possible address detection
```

Do not put unstable partials into durable conversation state.

---

## Foot gun: blocking asyncio

Do not run:

```text
LLM inference
ASR
TTS generation
heavy filesystem operations
```

directly on the realtime event loop.

Run them in proper workers/processes/threads.

Barge-in must remain responsive even when the GPU is loaded.

---

## Foot gun: provider failover loses state

Never let OpenAI, Ollama, or PicoClaw own canonical conversation history.

Hosaka owns state.

Providers are stateless computational backends from the architecture's perspective.

---

## Foot gun: too many services

Do not prematurely build microservices.

On the Jetson, initially use:

```text
one social cognition process
external ASR runtime if needed
external Ollama runtime
external Cavasik process
external PicoClaw if needed
```

Do not network-separate:

```text
chamber
governor
memory
attention
reflection
```

